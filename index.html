<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05070a" />
    <title>The Deck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IM+Fell+English+SC&family=Pirata+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" tabindex="0" aria-label="A deck of cards floats in the dark. Press Enter or click it to draw a card."></canvas>

    <p id="hint" class="hint" aria-hidden="true">touch the deck</p>

    <section id="reading" class="reading" aria-label="Your card" inert>
      <h1 class="reading__title"></h1>
      <p class="reading__meta"></p>
      <p class="reading__gloss"></p>
      <p class="reading__prose"></p>
      <button id="again" class="again" type="button">draw again</button>
      <p id="next-draw" class="reading__next" hidden></p>
    </section>

    <p id="announcer" class="sr-only" aria-live="polite"></p>

    <noscript><p class="noscript">The deck stirs only for those who allow JavaScript.</p></noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
